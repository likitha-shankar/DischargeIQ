<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- DischargeIQ app icon - faithful vector build of the user's chosen
       design: mint brain with checklist ticks and IQ, held by a navy hand,
       navy rounded frame on ice-white. iOS masks corners itself; the inner
       rounded border is part of the design. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#BFE9D4"/>
      <stop offset="0.75" stop-color="#DFF4E8"/>
      <stop offset="1" stop-color="#F2F8FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFC"/>
      <stop offset="1" stop-color="#E9F2F6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed ground -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- inner rounded frame (from the user's design) -->
  <rect x="52" y="52" width="920" height="920" rx="200" fill="none"
        stroke="#175A73" stroke-width="34"/>

  <!-- glow behind the brain -->
  <circle cx="512" cy="420" r="330" fill="url(#glow)"/>

  <!-- brain: union of mint circles with navy outline (stroke trick:
       stroked layer below, fill-only layer above erases inner strokes) -->
  <g stroke="#175A73" stroke-width="16" fill="#CBEEDC">
    <circle cx="400" cy="270" r="95"/>
    <circle cx="624" cy="270" r="95"/>
    <circle cx="292" cy="360" r="88"/>
    <circle cx="732" cy="360" r="88"/>
    <circle cx="266" cy="480" r="84"/>
    <circle cx="758" cy="480" r="84"/>
    <circle cx="330" cy="580" r="86"/>
    <circle cx="694" cy="580" r="86"/>
    <circle cx="452" cy="620" r="88"/>
    <circle cx="572" cy="620" r="88"/>
    <circle cx="512" cy="300" r="90"/>
  </g>
  <g fill="#CBEEDC">
    <circle cx="400" cy="270" r="88"/>
    <circle cx="624" cy="270" r="88"/>
    <circle cx="292" cy="360" r="81"/>
    <circle cx="732" cy="360" r="81"/>
    <circle cx="266" cy="480" r="77"/>
    <circle cx="758" cy="480" r="77"/>
    <circle cx="330" cy="580" r="79"/>
    <circle cx="694" cy="580" r="79"/>
    <circle cx="452" cy="620" r="81"/>
    <circle cx="572" cy="620" r="81"/>
    <circle cx="512" cy="300" r="83"/>
    <rect x="300" y="300" width="424" height="290"/>
  </g>

  <!-- checklist ticks and dashes inside the brain -->
  <g stroke="#175A73" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 330 l22 22 l38 -42"/>
    <line x1="410" y1="332" x2="466" y2="332"/>
    <path d="M552 330 l22 22 l38 -42"/>
    <line x1="652" y1="332" x2="708" y2="332"/>
    <path d="M310 620 l22 22 l38 -42"/>
    <line x1="410" y1="622" x2="466" y2="622"/>
    <path d="M552 620 l22 22 l38 -42"/>
    <line x1="652" y1="622" x2="708" y2="622"/>
  </g>

  <!-- IQ centered -->
  <text x="512" y="528" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif"
        font-size="150" font-weight="800" fill="#175A73">IQ</text>

  <!-- open hand cradling the brain: palm, four fingers, thumb -->
  <!-- Hand from Material Symbols "volunteer_activism" (Apache-2.0),
       heart subpaths removed - only the cupped hand + wrist remain. -->
  <g fill="#2E7391" transform="translate(205,985) scale(0.56)">
    <path d="m558-144 238-74q-5-9-14.5-15.5T760-240H558q-27 0-43-2t-33-8l-57-19q-16-5-23-20t-2-31q5-16 19.5-23.5T450-346l42 14q17 5 38.5 8t58.5 4h11q0-11-6.5-21T578-354l-234-86h-64v220l278 76Zm-21 78-257-72q-8 26-31.5 42T200-80h-80q-33 0-56.5-23.5T40-160v-280q0-33 23.5-56.5T120-520h224q7 0 14 1.5t13 3.5l235 87q33 12 53.5 42t20.5 66h80q50 0 85 33t35 87q0 22-11.5 34.5T833-145L583-67q-11 4-23 4t-23-3Zm-417-94h80v-280h-80v280Z"/>
  </g>
</svg>
