name: dischargeiq_mobile
description: DischargeIQ patient app - Flutter client for discharge summaries.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  file_picker: ^8.1.4
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  # Camera scan path (Sprint 2): capture via the system camera, recognize
  # text on-device with ML Kit - the photo never leaves the phone.
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  audioplayers: ^6.7.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
