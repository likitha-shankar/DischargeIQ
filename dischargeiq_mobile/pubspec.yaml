name: dischargeiq_mobile
description: DischargeIQ patient app - Flutter client for discharge summaries.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  # Direct dep (not just transitive via http): MediaType for the enhanced-scan
  # multipart photo upload.
  http_parser: ^4.0.2
  file_picker: ^8.1.4
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  # Camera scan path (Sprint 2): capture via the system camera, recognize
  # text on-device with ML Kit - the photo never leaves the phone.
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  audioplayers: ^6.7.1
  video_player: ^2.11.1
  # Add-to-calendar deep link on the Appointments tab (Task 2.2): opens the
  # Google Calendar event template in the browser/app - no calendar
  # permissions requested, nothing written on the patient's behalf.
  url_launcher: ^6.3.1
  # On-device document library (decision D-6): saved analyses live in the
  # app's private documents directory, never on the server.
  path_provider: ^2.1.5
  # Read-aloud (accessibility): on-device text-to-speech for every results
  # section. Nothing leaves the phone.
  flutter_tts: ^4.2.0
  # "View original" on results: renders the uploaded PDF via the platform's
  # native PDF engine (PDFKit on iOS).
  pdfx: ^2.9.2
  # Caregiver share (P-1) + understanding cards: native share sheet. The
  # patient chooses recipient and channel - nothing is sent automatically.
  share_plus: ^10.1.4
  # Medication reminders: LOCAL notifications only - schedules live on the
  # phone, nothing syncs anywhere. Adverse drug events are the most common
  # post-discharge complication; a missed-dose nudge is the highest-value
  # feature the competitor scan surfaced.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
